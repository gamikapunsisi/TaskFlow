yName)\n                .font(.caption)\n        }\n        .padding(.horizontal, 8)\n        .padding(.vertical, 4)\n        .background(status.color.opacity(0.15))\n        .foregroundColor(status.color)\n        .cornerRadius(6)\n    }\n}\n\n// Map view for booking location\nstruct BookingLocationMapView: View {\n    let booking: ServiceBooking\n    @Environment(\\.dismiss) private var dismiss\n    @State private var region = MKCoordinateRegion(\n        center: CLLocationCoordinate2D(latitude: 6.9271, longitude: 79.8612), // Colombo default\n        span: MKCoordinateSpan(latitudeDelta: 0.01, longitudeDelta: 0.01)\n    )\n    @State private var coordinate: CLLocationCoordinate2D?\n    @State private var isLoading = true\n    @State private var errorMessage: String?\n    \n    var body: some View {\n        NavigationView {\n            ZStack {\n                // Map view\n                Map(coordinateRegion: $region, annotationItems: coordinate.map { [MapLocation(coordinate: $0)] } ?? []) { location in\n                    MapAnnotation(coordinate: location.coordinate) {\n                        VStack(spacing: 4) {\n                            Image(systemName: \"mappin.circle.fill\")\n                                .font(.title)\n                                .foregroundColor(.red)\n                            \n                            VStack(spacing: 2) {\n                                Text(booking.customerName)\n                                    .font(.caption)\n                                    .fontWeight(.medium)\n                                Text(booking.serviceName)\n                                    .font(.caption2)\n                                    .foregroundColor(.secondary)\n                            }\n                            .padding(6)\n                            .background(.white)\n                            .cornerRadius(6)\n                            .shadow(radius: 2)\n                        }\n            