		17D9082D2E7D0C410022BF22 /* Debug */ = {
			isa = XCBuildConfiguration;
			buildSettings = {
				ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;
				ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME = AccentColor;
				CODE_SIGN_STYLE = Automatic;
				CURRENT_PROJECT_VERSION = 1;
				DEVELOPMENT_TEAM = TB42592928;
				ENABLE_PREVIEWS = YES;
				GENERATE_INFOPLIST_FILE = YES;
				INFOPLIST_KEY_NSFaceIDUsageDescription = "This app uses Face ID for secure login authentication";
				INFOPLIST_KEY_NSLocationWhenInUseUsageDescription = "This app shows customer locations for service bookings\nstruct UpcomingContractsView: View {\n    @StateObject private var bookingManager = BookingManager()\n    @State private var selectedDate: Date = Date()\n    \n    // Filter bookings for the selected date\n    var bookingsForSelectedDate: [ServiceBooking] {\n        bookingManager.currentBookings.filter {\n            Calendar.current.isDate($0.scheduledDate, inSameDayAs: selectedDate)\n        }\n    }\n    \n    var body: some View {\n        NavigationView {\n            ScrollView {\n                VStack(spacing: 24) {\n                    CalendarWeekView(\n                        selectedDate: $selectedDate,\n                        bookings: bookingManager.currentBookings\n                    )\n                    \n                    VStack(spacing: 16) {\n                        if bookingManager.isLoading {\n                            ProgressView(\"Loading bookings...\")\n                                .frame(maxWidth: .infinity, minHeight: 200)\n                        } else if bookingsForSelectedDate.isEmpty {\n                            VStack(spacing: 16) {\n                                Image(systemName: \"calendar.badge.exclamationmark\")\n                                    .font(.system(size: 50))\n                                    .foregroundColor(.gray)\n                                \n                                Text(\"No bookings scheduled\")\n                                    .font(.title2)\n                                    .foregroundColor(.secondary)\n                                \n                                Text(\"for \\(formattedSelectedDate())\")\n                                    .font(.subheadline)\n                                    .foregroundColor(.secondary)\n                            }\n                            .frame(maxWidth: .infinity, minHeight: 200)\n                        } else {\n                            ForEach(bookingsForSelectedDate) { booking in\n                                EnhancedBookingCardView(booking: booking) {\n                                    Task {\n                                        await bookingManager.updateBookingStatus(booking.id, status: .cancelled)\n                                    }\n                                }\n                            }\n                        }\n                    }\n                    .padding(.horizontal)\n                    \n                    if let errorMessage = bookingManager.errorMessage {\n                        Text(errorMessage)\n                            .foregroundColor(.red)\n                            .font(.caption)\n                            .padding()\n                    }\n                }\n                .padding(.vertical)\n            }\n            .navigationTitle(\"Upcoming Bookings\")\n            .navigationBarTitleDisplayMode(.large)\n            .refreshable {\n                let userId = \"gamikapunsisi\"\n                await bookingManager.fetchUserBookings(for: userId)\n            }\n            .onAppear {\n                let userId = \"gamikapunsisi\"\n                Task {\n                    await bookingManager.fetchUserBookings(for: userId)\n                }\n            }\n        }\n    }\n    \n    private func formattedSelectedDate() -> String {\n        let formatter = DateFormatter()\n        formatter.dateStyle = .medium\n        return formatter.string(from: selectedDate)\n    }\n}\n\n// Enhanced Booking Card with Map Integration\nstruct EnhancedBookingCardView: View {\n    let booking: ServiceBooking\n    var onCancel: () -> Void\n    @State private var showingMap = false\n    \n    var body: some View {\n        VStack(alignment: .leading, spacing: 12) {\n            // Header with service name and status\n            HStack {\n                Text(booking.serviceName)\n                    .font(.headline)\n                    .foregroundColor(.primary)\n                Spacer()\n                StatusBadge(status: booking.status)\n            }\n            \n            // Customer information\n            VStack(alignment: .leading, spacing: 6) {\n                HStack {\n                    Image(systemName: \"person.circle\")\n                        .foregroundColor(.blue)\n                        .font(.system(size: 16))\n                    Text(booking.customerName)\n                        .font(.subheadline)\n                        .fontWeight(.medium)\n                }\n                \n                HStack {\n                    Image(systemName: \"calendar\")\n                        .foregroundColor(.green)\n                        .font(.system(size: 14))\n                    Text(\"\\(booking.formattedDate) • \\(booking.formattedTime)\")\n                        .font(.caption)\n                        .foregroundColor(.secondary)\n                }\n            }\n            \n            // Address section with map button\n            VStack(alignment: .leading, spacing: 8) {\n                HStack {\n                    Image(systemName: \"location\")\n                        .foregroundColor(.red)\n                        .font(.system(size: 14))\n                    Text(\"Address:\")\n                        .font(.caption)\n                        .fontWeight(.medium)\n                        .foregroundColor(.secondary)\n                    Spacer()\n                }\n                \n                HStack {\n                    Text(booking.customerAddress)\n                        .font(.caption)\n                        .foregroundColor(.secondary)\n                        .lineLimit(2)\n                    \n                    Spacer()\n                    \n                    Button(action: {\n                        showingMap = true\n                    }) {\n                        HStack(spacing: 4) {\n         